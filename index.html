*{

.lang-switcher{

.lang-flag{

.card{

h2,h3{

.form-row{

.form-group{

label{

input,

input:focus,

}

/* =========================================================
   ЭТИКЕТКА
   РАЗМЕР: 130 × 76 мм
   Отступ сверху и слева: 20 мм
   ========================================================= */

#print-area{
    display:none;
}

/*
 * ЭТИКЕТКА 130 × 76 мм
 *
 * Текст начинается через 20 мм от левого края
 * и 20 мм от верхнего края.
 * Штрихкод остаётся по центру этикетки, как было изначально.
 */
.print-label{
    width:130mm;
    height:200mm;
    background:#fff;
    color:#000;
    font-family:Arial,Helvetica,sans-serif;

    /* Сверху 20 мм, слева 20 мм */
    padding:20mm 7mm 5mm 20mm;

    box-sizing:border-box;
    overflow:hidden;
    page-break-after:always;
    break-after:page;
}

.print-block{
    width:100%;
    max-width:103mm;
    margin-bottom:3mm;
}

.print-title{
    font-size:10pt;
    font-weight:900;
    line-height:1;
    margin-bottom:1.5mm;
}

.print-value{
    width:100%;
    max-width:103mm;
    font-size:16pt;
    font-weight:900;
    line-height:1.1;

    /* Длинный текст не обрезаем */
    white-space:normal;
    overflow:visible;
    text-overflow:clip;
    overflow-wrap:anywhere;
    word-break:break-word;
}

.print-barcode{
    display:block;
    width:110mm !important;
    max-width:110mm !important;
    height:120mm !important;
    margin:6mm auto 0;
}

@page{
    size:130mm 200mm;
    margin:0;
}


/* =========================================================
   ПЕЧАТЬ
   ========================================================= */

@media print{

    html,
    body{
        width:130mm !important;
        min-width:130mm !important;
        max-width:130mm !important;
        margin:0 !important;
        padding:0 !important;
        background:#fff !important;
    }

    body *{
        visibility:hidden !important;
    }

    #print-area,
    #print-area *{
        visibility:visible !important;
    }

    #print-area{
        display:block !important;
        position:absolute !important;
        left:0 !important;
        top:0 !important;
        width:130mm !important;
        margin:0 !important;
        padding:0 !important;
    }

    .print-label{
        display:block !important;
        width:130mm !important;
        height:200mm !important;
        margin:0 !important;

        /* В печати тоже 20 мм сверху и слева */
        padding:20mm 7mm 5mm 20mm !important;

        box-sizing:border-box !important;
        page-break-after:always !important;
        break-after:page !important;
        overflow:hidden !important;
    }

    .print-block,
    .print-value{
        max-width:103mm !important;
        box-sizing:border-box !important;
    }

    .print-value{
        white-space:normal !important;
        overflow:visible !important;
        overflow-wrap:anywhere !important;
        word-break:break-word !important;
    }

    .print-barcode{
        width:110mm !important;
        max-width:110mm !important;
        height:120mm !important;
    }
}

/* =========================================================

function setLanguage(lang,element){

    currentLang = lang;

    localStorage.setItem(
        "site_lang",
        lang
    );


    document
        .querySelectorAll(".lang-flag")
        .forEach(el => {

            el.classList.remove("active");

        });


    if(element){

        element.classList.add("active");

    }else{

        const flags =
            document.querySelectorAll(".lang-flag");

        const indexes = {
            ru:0,
            uk:1,
            pl:2,
            en:3
        };

        if(flags[indexes[lang]]){

            flags[indexes[lang]]
                .classList.add("active");

        }

    }


    document
        .querySelectorAll("[data-i18n]")
        .forEach(el => {

            const key =
                el.getAttribute("data-i18n");

            if(translations[lang][key]){

                el.textContent =
                    translations[lang][key];

            }

        });


    document
        .querySelectorAll("[data-i18n-placeholder]")
        .forEach(el => {

            const key =
                el.getAttribute(
                    "data-i18n-placeholder"
                );

            if(translations[lang][key]){

                el.placeholder =
                    translations[lang][key];

            }

        });


    if(currentSearchResults.length){

        renderTable(
            currentSearchResults
        );

    }

}

/* =========================================================
   API REQUEST
   ========================================================= */

async function request(payload){

    try{

        const response =
            await fetch(API_URL,{

                method:"POST",

                headers:{
                    "Content-Type":
                        "text/plain;charset=utf-8"
                },

                body:
                    JSON.stringify(payload)

            });


        return await response.json();


    }catch(error){

        return{

            success:false,

            error:error.message

        };

    }

}


/* =========================================================
   ЗАЩИТА HTML
   ========================================================= */

function escapeHtml(value){

    return String(value ?? "")
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");

}


/* =========================================================
   ДАТА
   ========================================================= */

function formatDate(value){

    if(!value){

        return "";

    }


    const text =
        String(value);


    const match =
        text.match(
            /^(\d{4})-(\d{2})-(\d{2})$/
        );


    if(match){

        return `${match[3]}.${match[2]}.${match[1]}`;

    }


    return text;

}


/* =========================================================
   ПЕЧАТЬ ЭТИКЕТОК
   РОВНО 2 ОДИНАКОВЫЕ ЭТИКЕТКИ
   РАЗМЕР: 130 × 76 мм
   ========================================================= */

function printLabels(
    data,
    pn,
    location
){

    const area =
        document.getElementById(
            "print-area"
        );


    /*
     * ДАТА
     *
     * Берём дату из DATA.
     * Если DATA пустая — используем текущую дату.
     */
    let dateValue = data;

    if(!dateValue){

        const now = new Date();

        const year =
            now.getFullYear();

        const month =
            String(
                now.getMonth() + 1
            ).padStart(2,"0");

        const day =
            String(
                now.getDate()
            ).padStart(2,"0");

        dateValue =
            `${year}-${month}-${day}`;

    }


    const dateText =
        escapeHtml(
            formatDate(dateValue)
        );

    const pnText =
        escapeHtml(pn);

    const locationText =
        escapeHtml(location);


    /*
     * Одна готовая этикетка.
     *
     * Сохраняем старое расположение:
     * сверху DATA / PN / LOCATION,
     * снизу по центру штрихкод.
     *
     * Добавили только DATE.
     */
    const label = `

        <div class="print-label">

            <div class="print-block">

                <div class="print-title">
                    DATE
                </div>

                <div class="print-value">
                    ${dateText}
                </div>

            </div>


            <div class="print-block">

                <div class="print-title">
                    PN
                </div>

                <div class="print-value">
                    ${pnText}
                </div>

            </div>


            <div class="print-block">

                <div class="print-title">
                    LOCATION
                </div>

                <div class="print-value">
                    ${locationText}
                </div>

            </div>


            <svg class="print-barcode"></svg>

        </div>

    `;


    /*
     * Всегда только 2 одинаковые этикетки.
     */
    area.innerHTML =
        label + label;


    /*
     * Создаём штрихкод.
     */
    const barcodes =
        area.querySelectorAll(
            ".print-barcode"
        );


    barcodes.forEach(svg => {

        JsBarcode(
            svg,
            String(pn),
            {

                format:"CODE128B",

                displayValue:false,

                width:2,

                height:140,

                margin:0,

                lineColor:"#000",

                background:"#fff"

            }
        );


        /*
         * ВАЖНО:
         * JsBarcode задаёт width/height как пиксельные
         * атрибуты SVG без viewBox, из-за чего CSS-размеры
         * (мм) не растягивают саму картинку штрихкода.
         * Добавляем viewBox и убираем фиксированные
         * атрибуты, чтобы штрихкод реально масштабировался
         * под размер, заданный в CSS.
         */

        const w =
            svg.getAttribute("width");

        const h =
            svg.getAttribute("height");

        if(w && h){

            svg.setAttribute(
                "viewBox",
                `0 0 ${w} ${h}`
            );

            svg.setAttribute(
                "preserveAspectRatio",
                "none"
            );

            svg.removeAttribute("width");

            svg.removeAttribute("height");

        }

    });


    /*
     * Если PN или LOCATION слишком длинные,
     * уменьшаем шрифт, но НЕ обрезаем текст.
     */
    area
        .querySelectorAll(".print-value")
        .forEach(el => {

            let size =
                parseFloat(
                    getComputedStyle(el).fontSize
                );

            const minSize = 7;

            while(
                el.scrollWidth > el.clientWidth &&
                size > minSize
            ){

                size -= 0.5;

                el.style.fontSize =
                    size + "pt";

            }

        });


    area.style.display =
        "block";


    /*
     * Даём браузеру время отрисовать SVG.
     */
    setTimeout(() => {

        window.print();

    },300);

}

/* =========================================================
   ПОСЛЕ ПЕЧАТИ
   ========================================================= */

window.addEventListener(
    "afterprint",
    () => {

        const area =
            document.getElementById(
                "print-area"
            );


        area.innerHTML = "";

        area.style.display =
            "none";

    }
);


/* =========================================================
   ДОБАВЛЕНИЕ
   ========================================================= */

async function addBulk(){

    const panelPns =
        document
            .getElementById(
                "add-panel-pn"
            )
            .value
            .trim();


    if(!panelPns){

        alert(
            translations[currentLang]
                .errEnterPn
        );

        return;

    }


    const data =
        document.getElementById(
            "add-data"
        ).value;


    const pn =
        document
            .getElementById(
                "add-pn"
            )
            .value
            .trim();


    const location =
        document
            .getElementById(
                "add-location"
            )
            .value
            .trim();


    const info =
        document.getElementById(
            "add-info"
        ).value;


    document.getElementById(
        "add-status"
    ).textContent =
        translations[currentLang]
            .statusRecord;


    const res =
        await request({

            action:"addBulk",

            panelPns:panelPns,

            data:data,

            pn:pn,

            location:location,

            info:info

        });


    document.getElementById(
        "add-status"
    ).textContent = "";


    if(res.success){

        /*
         * СНАЧАЛА сохраняем данные.
         * ПОТОМ печатаем 2 этикетки.
         */

        printLabels(
            data,
            pn,
            location
        );


        document.getElementById(
            "add-panel-pn"
        ).value = "";


        document.getElementById(
            "add-info"
        ).value = "";


        setTimeout(() => {

            alert(
                res.message
            );

        },500);


    }else{

        alert(
            "Ошибка: " +
            res.error
        );

    }

}


/* =========================================================
   ПОИСК
   ========================================================= */

async function searchData(){

    const q =
        document
            .getElementById(
                "search-query"
            )
            .value
            .trim();


    if(!q){

        alert(
            translations[currentLang]
                .errEnterQuery
        );

        return;

    }


    document.getElementById(
        "search-status"
    ).textContent =
        translations[currentLang]
            .statusSearch;


    document.getElementById(
        "results-container"
    ).innerHTML = "";


    document.getElementById(
        "edit-section"
    ).style.display =
        "none";


    const res =
        await request({

            action:"search",

            query:q

        });


    document.getElementById(
        "search-status"
    ).textContent = "";


    if(res.success){

        currentSearchResults =
            res.data;


        if(res.data.length > 0){

            renderTable(
                res.data
            );


            document.getElementById(
                "edit-section"
            ).style.display =
                "block";


        }else{

            document.getElementById(
                "results-container"
            ).innerHTML = `

                <p class="hint">

                    ${
                        translations[currentLang]
                            .notFound
                    }

                </p>

            `;

        }


    }else{

        alert(
            "Ошибка: " +
            res.error
        );

    }

}


/* =========================================================
   ТАБЛИЦА
   ========================================================= */

function renderTable(data){

    let html = `

        <table>

            <tr>

                <th>Panel_pn</th>

                <th>DATA</th>

                <th>PN</th>

                <th>Location</th>

                <th>info</th>

            </tr>

    `;


    data.forEach(row => {

        html += `

            <tr>

                <td>
                    ${escapeHtml(row.panel_pn)}
                </td>

                <td>
                    ${escapeHtml(row.data)}
                </td>

                <td>
                    ${escapeHtml(row.pn)}
                </td>

                <td>
                    ${escapeHtml(row.location)}
                </td>

                <td>
                    ${escapeHtml(row.info)}
                </td>

            </tr>

        `;

    });


    html += "</table>";


    document.getElementById(
        "results-container"
    ).innerHTML =
        html;

}


/* =========================================================
   ОБНОВЛЕНИЕ
   ========================================================= */

async function updateBulk(){

    if(currentSearchResults.length === 0){

        return;

    }


    const rowNumbers =
        currentSearchResults.map(
            row => row.rowNumber
        );


    const newData =
        document.getElementById(
            "edit-data"
        ).value;


    const newLocation =
        document
            .getElementById(
                "edit-location"
            )
            .value
            .trim();


    const newInfo =
        document.getElementById(
            "edit-info"
        ).value;


    if(
        !newData &&
        !newLocation &&
        !newInfo
    ){

        alert(
            translations[currentLang]
                .errFillOne
        );

        return;

    }


    if(
        !confirm(
            translations[currentLang]
                .confirmUpdate(
                    rowNumbers.length
                )
        )
    ){

        return;

    }


    document.getElementById(
        "search-status"
    ).textContent =
        translations[currentLang]
            .statusUpdate;


    const res =
        await request({

            action:"updateBulk",

            rowNumbers:rowNumbers,

            data:newData,

            location:newLocation,

            info:newInfo

        });


    document.getElementById(
        "search-status"
    ).textContent = "";


    if(res.success){

        /*
         * ДАННЫЕ ДЛЯ ЭТИКЕТКИ
         */

        const firstRow =
            currentSearchResults[0];


        const printData =
            newData ||
            firstRow.data ||
            "";


        const printPn =
            firstRow.pn ||
            "";


        const printLocation =
            newLocation ||
            firstRow.location ||
            "";


        /*
         * После обновления
         * печатаем ровно 2 этикетки.
         */

        printLabels(
            printData,
            printPn,
            printLocation
        );


        /*
         * Очищаем поля редактирования.
         */

        document.getElementById(
            "edit-data"
        ).value = "";


        document.getElementById(
            "edit-location"
        ).value = "";


        document.getElementById(
            "edit-info"
        ).value = "";


        /*
         * Обновляем таблицу.
         */

        setTimeout(() => {

            searchData();

        },700);


        setTimeout(() => {

            alert(
                res.message
            );

        },500);


    }else{

        alert(
            "Ошибка: " +
            res.error
        );

    }

}

</script>
