<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>База данных деталей</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #080d12;
            background-image: linear-gradient(to bottom, #080d12, #101a24);
            color: #d4d4d4;
            margin: 0;
            padding: 15px;
            min-height: 100vh;
        }
        .container {
            max-width: 1000px;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        /* Панель переключения языков с флагами */
        .lang-switcher {
            display: flex;
            justify-content: flex-end;
            gap: 8px;
            margin-bottom: -5px;
        }
        .lang-flag {
            cursor: pointer;
            font-size: 20px;
            padding: 2px 4px;
            border-radius: 4px;
            background: rgba(25, 35, 45, 0.9);
            border: 1px solid #2c4152;
            transition: transform 0.2s, border-color 0.2s;
            line-height: 1;
        }
        .lang-flag:hover {
            transform: scale(1.1);
            border-color: #2dbab1;
        }
        .lang-flag.active {
            border-color: #2dbab1;
            box-shadow: 0 0 5px rgba(45, 186, 177, 0.5);
        }

        .card {
            background: rgba(25, 35, 45, 0.9);
            border: 1px solid #145e61;
            border-radius: 6px;
            padding: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.6);
        }
        h2, h3 {
            margin-top: 0;
            color: #2dbab1;
            margin-bottom: 10px;
            font-size: 15px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        
        .form-row {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            margin-bottom: 10px;
        }
        .form-group {
            flex: 1;
            min-width: 130px;
            display: flex;
            flex-direction: column;
        }
        label {
            font-size: 10px;
            font-weight: bold;
            margin-bottom: 4px;
            color: #8da4b5;
            text-transform: uppercase;
        }
        input, textarea {
            padding: 6px 8px;
            background-color: #121922;
            border: 1px solid #2c4152;
            border-radius: 4px;
            color: #fff;
            font-size: 12px;
            font-family: inherit;
            transition: border-color 0.2s;
        }
        input:focus, textarea:focus {
            outline: none;
            border-color: #2dbab1;
            box-shadow: 0 0 0 1px #2dbab1;
        }
        textarea { resize: vertical; }
        
        .btn {
            padding: 8px 12px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
            font-size: 11px;
            color: #fff;
            text-transform: uppercase;
            transition: background 0.2s;
        }
        .btn-blue { background-color: #177a7d; }
        .btn-blue:hover { background-color: #2dbab1; }
        .btn-green { background-color: #145e61; margin-top: 5px; width: 100%;}
        .btn-green:hover { background-color: #177a7d; }
        
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
            font-size: 11px;
            background: #121922;
        }
        th, td {
            border: 1px solid #2c4152;
            padding: 5px 8px;
            text-align: center;
        }
        th { 
            background-color: #177a7d; 
            font-weight: bold; 
            color: #fff;
            text-transform: uppercase;
        }
        tr:nth-child(even) { background-color: #18232e; }
        tr:hover { background-color: #1f2e3d; }
        
        .loading { font-size: 11px; color: #2dbab1; margin-top: 5px; font-weight: bold; }
        
        #edit-section {
            background: #121922;
            border: 1px solid #2c4152;
            padding: 10px;
            border-radius: 4px;
            margin: 10px 0;
        }
        .hint { font-size: 10px; color: #6b8296; margin-top: 0; margin-bottom: 8px; }
    </style>
</head>
<body>

<div class="container">
    <!-- ПАНЕЛЬ ФЛАГОВ (ЯЗЫКИ) -->
    <div class="lang-switcher">
        <span class="lang-flag" onclick="setLanguage('ru')" title="Русский">🇷🇺</span>
        <span class="lang-flag" onclick="setLanguage('uk')" title="Українська">🇺🇦</span>
        <span class="lang-flag" onclick="setLanguage('pl')" title="Polski">🇵🇱</span>
        <span class="lang-flag" onclick="setLanguage('en')" title="English">🇬🇧</span>
    </div>

    <!-- БЛОК ДОБАВЛЕНИЯ -->
    <div class="card">
        <h2 data-i18n="addTitle">Массовое добавление</h2>
        <div class="form-group" style="margin-bottom: 10px;">
            <label data-i18n="labelPanelPn">Panel_pn (Список с новой строки)</label>
            <textarea id="add-panel-pn" rows="3" placeholder="750TBV500S74HHN000&#10;750TBV500S78AHN000..."></textarea>
        </div>
        <div class="form-row">
            <div class="form-group"><label data-i18n="labelData">DATA</label><input type="date" id="add-data" /></div>
            <div class="form-group"><label data-i18n="labelPn">PN</label><input type="text" id="add-pn" placeholder="Например: 203BYQ..." /></div>
            <div class="form-group"><label data-i18n="labelLocation">Location</label><input type="text" id="add-location" placeholder="KUWETRA 666" /></div>
            <div class="form-group"><label data-i18n="labelInfo">info</label><input type="text" id="add-info" placeholder="DIFF PLATE 50" /></div>
        </div>
        <button class="btn btn-blue" onclick="addBulk()" data-i18n="btnAdd">+ Добавить список</button>
        <div id="add-status" class="loading"></div>
    </div>

    <!-- БЛОК ПОИСКА И РЕДАКТИРОВАНИЯ -->
    <div class="card">
        <h2 data-i18n="searchTitle">Поиск и Редактирование</h2>
        <div class="form-row" style="margin-bottom: 5px;">
            <input type="text" id="search-query" style="flex: 3; min-width: 200px;" placeholder="Введите PN или Panel_pn" data-i18n-placeholder="searchPlaceholder" />
            <button class="btn btn-blue" style="flex: 1;" onclick="searchData()" data-i18n="btnSearch">Найти</button>
        </div>
        <div id="search-status" class="loading"></div>

        <!-- Скрытый блок редактирования -->
        <div id="edit-section" style="display: none;">
            <h3 data-i18n="editTitle">Изменить найденные строки</h3>
            <p class="hint" data-i18n="editHint">Оставьте поле пустым, если не хотите его менять.</p>
            <div class="form-row">
                <div class="form-group"><label data-i18n="labelNewData">Новая Дата</label><input type="date" id="edit-data" /></div>
                <div class="form-group"><label data-i18n="labelNewLocation">Новая Локация</label><input type="text" id="edit-location" /></div>
                <div class="form-group"><label data-i18n="labelNewInfo">Новое info</label><input type="text" id="edit-info" /></div>
            </div>
            <button class="btn btn-green" onclick="updateBulk()" data-i18n="btnUpdate">Применить изменения</button>
        </div>

        <div style="overflow-x: auto;">
            <div id="results-container"></div>
        </div>
    </div>
</div>

<script>
    const API_URL = "https://script.google.com/macros/s/AKfycbwCvcIfaYATD8AFk9PZezOnMILNgecMKkefI7P81pSR4hxiLQXIa9rirL8LCM7s0AzT/exec";
    
    let currentSearchResults = [];

    // Словарь переводов для 4 языков
    const translations = {
        ru: {
            addTitle: "Массовое добавление",
            labelPanelPn: "Panel_pn (Список с новой строки)",
            labelData: "DATA",
            labelPn: "PN",
            labelLocation: "Location",
            labelInfo: "info",
            btnAdd: "+ Добавить список",
            searchTitle: "Поиск и Редактирование",
            searchPlaceholder: "Введите PN или Panel_pn",
            btnSearch: "Найти",
            editTitle: "Изменить найденные строки",
            editHint: "Оставьте поле пустым, если не хотите его менять.",
            labelNewData: "Новая Дата",
            labelNewLocation: "Новая Локация",
            labelNewInfo: "Новое info",
            btnUpdate: "Применить изменения",
            statusRecord: "Запись...",
            statusSearch: "Поиск...",
            statusUpdate: "Обновление...",
            notFound: "Ничего не найдено.",
            errEnterPn: "Введите хотя бы один Panel_pn",
            errEnterQuery: "Введите запрос",
            errFillOne: "Заполните хотя бы одно поле!",
            confirmUpdate: (count) => `Обновить ${count} строк?`
        },
        uk: {
            addTitle: "Масове додавання",
            labelPanelPn: "Panel_pn (Список з нового рядка)",
            labelData: "DATA",
            labelPn: "PN",
            labelLocation: "Location",
            labelInfo: "info",
            btnAdd: "+ Додати список",
            searchTitle: "Пошук та Редагування",
            searchPlaceholder: "Введіть PN або Panel_pn",
            btnSearch: "Знайти",
            editTitle: "Змінити знайдені рядки",
            editHint: "Залиште поле порожнім, якщо не хочете його змінювати.",
            labelNewData: "Нова Дата",
            labelNewLocation: "Нова Локація",
            labelNewInfo: "Нове info",
            btnUpdate: "Застосувати зміни",
            statusRecord: "Запис...",
            statusSearch: "Пошук...",
            statusUpdate: "Оновлення...",
            notFound: "Нічого не знайдено.",
            errEnterPn: "Введіть хоча б один Panel_pn",
            errEnterQuery: "Введіть запит",
            errFillOne: "Заповніть хоча б одне поле!",
            confirmUpdate: (count) => `Оновити ${count} рядків?`
        },
        pl: {
            addTitle: "Masowe dodawanie",
            labelPanelPn: "Panel_pn (Lista z nowej linii)",
            labelData: "DATA",
            labelPn: "PN",
            labelLocation: "Location",
            labelInfo: "info",
            btnAdd: "+ Dodaj listę",
            searchTitle: "Wyszukiwanie i Edycja",
            searchPlaceholder: "Wpisz PN lub Panel_pn",
            btnSearch: "Szukaj",
            editTitle: "Edytuj znalezione wiersze",
            editHint: "Pozostaw pole puste, jeśli chcesz je pominąć.",
            labelNewData: "Nowa Data",
            labelNewLocation: "Nowa Lokalizacja",
            labelNewInfo: "Nowe info",
            btnUpdate: "Zastosuj zmiany",
            statusRecord: "Zapisywanie...",
            statusSearch: "Szukanie...",
            statusUpdate: "Aktualizacja...",
            notFound: "Nic nie znaleziono.",
            errEnterPn: "Wprowadź co najmniej jeden Panel_pn",
            errEnterQuery: "Wprowadź zapytanie",
            errFillOne: "Wypełnij co najmniej jedno pole!",
            confirmUpdate: (count) => `Zaktualizować ${count} wierszy?`
        },
        en: {
            addTitle: "Bulk Add",
            labelPanelPn: "Panel_pn (List, one per line)",
            labelData: "DATA",
            labelPn: "PN",
            labelLocation: "Location",
            labelInfo: "info",
            btnAdd: "+ Add List",
            searchTitle: "Search & Edit",
            searchPlaceholder: "Enter PN or Panel_pn",
            btnSearch: "Search",
            editTitle: "Edit Found Rows",
            editHint: "Leave the field empty if you don't want to change it.",
            labelNewData: "New Date",
            labelNewLocation: "New Location",
            labelNewInfo: "New info",
            btnUpdate: "Apply Changes",
            statusRecord: "Saving...",
            statusSearch: "Searching...",
            statusUpdate: "Updating...",
            notFound: "Nothing found.",
            errEnterPn: "Enter at least one Panel_pn",
            errEnterQuery: "Enter search query",
            errFillOne: "Fill out at least one field!",
            confirmUpdate: (count) => `Update ${count} rows?`
        }
    };

    let currentLang = localStorage.getItem('site_lang') || 'ru';

    function setLanguage(lang) {
        currentLang = lang;
        localStorage.setItem('site_lang', lang);

        // Подсветка активного флага
        document.querySelectorAll('.lang-flag').forEach(el => {
            el.classList.remove('active');
        });
        event && event.target && event.target.classList.add('active');

        // Меняем тексты по атрибуту data-i18n
        document.querySelectorAll('[data-i18n]').forEach(el => {
            const key = el.getAttribute('data-i18n');
            if (translations[lang][key]) {
                el.innerText = translations[lang][key];
            }
        });

        // Меняем placeholder'ы
        document.querySelectorAll('[data-i18n-placeholder]').forEach(el => {
            const key = el.getAttribute('data-i18n-placeholder');
            if (translations[lang][key]) {
                el.placeholder = translations[lang][key];
            }
        });

        // Если таблица результатов уже открыта, перерисовываем заголовки таблиц
        if (currentSearchResults.length > 0) {
            renderTable(currentSearchResults);
        }
    }

    // Инициализация языка при загрузке страницы
    window.addEventListener('DOMContentLoaded', () => {
        setLanguage(currentLang);
        // Выставим класс active нужному флагу визуально
        const flags = document.querySelectorAll('.lang-flag');
        if(currentLang === 'ru') flags[0].classList.add('active');
        if(currentLang === 'uk') flags[1].classList.add('active');
        if(currentLang === 'pl') flags[2].classList.add('active');
        if(currentLang === 'en') flags[3].classList.add('active');
    });

    async function request(payload) {
        try {
            const response = await fetch(API_URL, {
                method: 'POST',
                headers: {'Content-Type': 'text/plain;charset=utf-8'}, 
                body: JSON.stringify(payload)
            });
            return await response.json();
        } catch (error) {
            return {success: false, error: error.message};
        }
    }

    async function addBulk() {
        const panelPns = document.getElementById('add-panel-pn').value;
        if(!panelPns) return alert(translations[currentLang].errEnterPn);
        
        document.getElementById('add-status').innerText = translations[currentLang].statusRecord;
        
        const payload = {
            action: 'addBulk',
            panelPns: panelPns,
            data: document.getElementById('add-data').value,
            pn: document.getElementById('add-pn').value,
            location: document.getElementById('add-location').value,
            info: document.getElementById('add-info').value
        };
        
        const res = await request(payload);
        document.getElementById('add-status').innerText = "";
        
        if(res.success) {
            alert(res.message);
            document.getElementById('add-panel-pn').value = ""; 
        } else alert("Ошибка: " + res.error);
    }

    async function searchData() {
        const q = document.getElementById('search-query').value;
        if(!q) return alert(translations[currentLang].errEnterQuery);
        
        document.getElementById('search-status').innerText = translations[currentLang].statusSearch;
        document.getElementById('results-container').innerHTML = "";
        document.getElementById('edit-section').style.display = 'none';

        const res = await request({action: 'search', query: q});
        document.getElementById('search-status').innerText = "";
        
        if(res.success) {
            currentSearchResults = res.data;
            if(res.data.length > 0) {
                renderTable(res.data);
                document.getElementById('edit-section').style.display = 'block';
            } else {
                document.getElementById('results-container').innerHTML = `<p class='hint'>${translations[currentLang].notFound}</p>`;
            }
        } else alert("Ошибка: " + res.error);
    }

    function renderTable(data) {
        let html = `<table>
            <tr>
                <th>Panel_pn</th>
                <th>DATA</th>
                <th>PN</th>
                <th>Location</th>
                <th>info</th>
            </tr>`;
        data.forEach(row => {
            html += `<tr>
                <td>${row.panel_pn}</td>
                <td>${row.data}</td>
                <td>${row.pn}</td>
                <td>${row.location}</td>
                <td>${row.info}</td>
            </tr>`;
        });
        html += "</table>";
        document.getElementById('results-container').innerHTML = html;
    }

    async function updateBulk() {
        if(currentSearchResults.length === 0) return;
        
        const rowNumbers = currentSearchResults.map(r => r.rowNumber);
        const newData = document.getElementById('edit-data').value;
        const newLocation = document.getElementById('edit-location').value;
        const newInfo = document.getElementById('edit-info').value;

        if(!newData && !newLocation && !newInfo) return alert(translations[currentLang].errFillOne);
        if(!confirm(translations[currentLang].confirmUpdate(rowNumbers.length))) return;

        document.getElementById('search-status').innerText = translations[currentLang].statusUpdate;
        
        const res = await request({
            action: 'updateBulk',
            rowNumbers: rowNumbers,
            data: newData,
            location: newLocation,
            info: newInfo
        });
        
        document.getElementById('search-status').innerText = "";
        
        if(res.success) {
            alert(res.message);
            document.getElementById('edit-data').value = "";
            document.getElementById('edit-location').value = "";
            document.getElementById('edit-info').value = "";
            searchData(); 
        } else alert("Ошибка: " + res.error);
    }
</script>
</body>
</html>
