<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>База данных деталей</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #080d12;
            background-image: linear-gradient(to bottom, #080d12, #101a24);
            color: #d4d4d4;
            margin: 0;
            padding: 15px;
            min-height: 100vh;
        }
        .container {
            max-width: 1000px;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        .card {
            background: rgba(25, 35, 45, 0.9);
            border: 1px solid #145e61;
            border-radius: 6px;
            padding: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.6);
        }
        h2, h3 {
            margin-top: 0;
            color: #2dbab1;
            margin-bottom: 10px;
            font-size: 15px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        
        .form-row {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            margin-bottom: 10px;
        }
        .form-group {
            flex: 1;
            min-width: 130px;
            display: flex;
            flex-direction: column;
        }
        label {
            font-size: 10px;
            font-weight: bold;
            margin-bottom: 4px;
            color: #8da4b5;
            text-transform: uppercase;
        }
        input, textarea {
            padding: 6px 8px;
            background-color: #121922;
            border: 1px solid #2c4152;
            border-radius: 4px;
            color: #fff;
            font-size: 12px;
            font-family: inherit;
            transition: border-color 0.2s;
        }
        input:focus, textarea:focus {
            outline: none;
            border-color: #2dbab1;
            box-shadow: 0 0 0 1px #2dbab1;
        }
        textarea { resize: vertical; }
        
        .btn {
            padding: 8px 12px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
            font-size: 11px;
            color: #fff;
            text-transform: uppercase;
            transition: background 0.2s;
        }
        .btn-blue { background-color: #177a7d; }
        .btn-blue:hover { background-color: #2dbab1; }
        .btn-green { background-color: #145e61; margin-top: 5px; width: 100%;}
        .btn-green:hover { background-color: #177a7d; }
        
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
            font-size: 11px;
            background: #121922;
        }
        th, td {
            border: 1px solid #2c4152;
            padding: 5px 8px;
            text-align: center;
        }
        th { 
            background-color: #177a7d; 
            font-weight: bold; 
            color: #fff;
            text-transform: uppercase;
        }
        tr:nth-child(even) { background-color: #18232e; }
        tr:hover { background-color: #1f2e3d; }
        
        .loading { font-size: 11px; color: #2dbab1; margin-top: 5px; font-weight: bold; }
        
        #edit-section {
            background: #121922;
            border: 1px solid #2c4152;
            padding: 10px;
            border-radius: 4px;
            margin: 10px 0;
        }
        .hint { font-size: 10px; color: #6b8296; margin-top: 0; margin-bottom: 8px; }
    </style>
</head>
<body>

<div class="container">
    <!-- БЛОК ДОБАВЛЕНИЯ -->
    <div class="card">
        <h2>Массовое добавление</h2>
        <div class="form-group" style="margin-bottom: 10px;">
            <label>Panel_pn (Список с новой строки)</label>
            <textarea id="add-panel-pn" rows="3" placeholder="750TBV500S74HHN000&#10;750TBV500S78AHN000..."></textarea>
        </div>
        <div class="form-row">
            <div class="form-group"><label>DATA</label><input type="date" id="add-data" /></div>
            <div class="form-group"><label>PN</label><input type="text" id="add-pn" placeholder="Например: 203BYQ..." /></div>
            <div class="form-group"><label>Location</label><input type="text" id="add-location" placeholder="KUWETRA 666" /></div>
            <div class="form-group"><label>info</label><input type="text" id="add-info" placeholder="DIFF PLATE 50" /></div>
        </div>
        <button class="btn btn-blue" onclick="addBulk()">+ Добавить список</button>
        <div id="add-status" class="loading"></div>
    </div>

    <!-- БЛОК ПОИСКА И РЕДАКТИРОВАНИЯ -->
    <div class="card">
        <h2>Поиск и Редактирование</h2>
        <div class="form-row" style="margin-bottom: 5px;">
            <input type="text" id="search-query" style="flex: 3; min-width: 200px;" placeholder="Введите PN или Panel_pn" />
            <button class="btn btn-blue" style="flex: 1;" onclick="searchData()">Найти</button>
        </div>
        <div id="search-status" class="loading"></div>

        <!-- Скрытый блок редактирования -->
        <div id="edit-section" style="display: none;">
            <h3>Изменить найденные строки</h3>
            <p class="hint">Оставьте поле пустым, если не хотите его менять.</p>
            <div class="form-row">
                <div class="form-group"><label>Новая Дата</label><input type="date" id="edit-data" /></div>
                <div class="form-group"><label>Новая Локация</label><input type="text" id="edit-location" /></div>
                <div class="form-group"><label>Новое info</label><input type="text" id="edit-info" /></div>
            </div>
            <button class="btn btn-green" onclick="updateBulk()">Применить изменения</button>
        </div>

        <div style="overflow-x: auto;">
            <div id="results-container"></div>
        </div>
    </div>
</div>

<script>
    const API_URL = "https://script.google.com/macros/s/AKfycbzMgmejnm_qu01oojng73VOOoWrRFZ_rZkRLwS-NzkQeYeh3bpMx8D9V93f3pKLq8_i/exec";
    
    let currentSearchResults = [];

    async function request(payload) {
        try {
            const response = await fetch(API_URL, {
                method: 'POST',
                headers: {'Content-Type': 'text/plain;charset=utf-8'}, 
                body: JSON.stringify(payload)
            });
            return await response.json();
        } catch (error) {
            return {success: false, error: error.message};
        }
    }

    async function addBulk() {
        const panelPns = document.getElementById('add-panel-pn').value;
        if(!panelPns) return alert("Введите хотя бы один Panel_pn");
        
        document.getElementById('add-status').innerText = "Запись...";
        
        const payload = {
            action: 'addBulk',
            panelPns: panelPns,
            data: document.getElementById('add-data').value,
            pn: document.getElementById('add-pn').value,
            location: document.getElementById('add-location').value,
            info: document.getElementById('add-info').value
        };
        
        const res = await request(payload);
        document.getElementById('add-status').innerText = "";
        
        if(res.success) {
            alert(res.message);
            document.getElementById('add-panel-pn').value = ""; 
        } else alert("Ошибка: " + res.error);
    }

    async function searchData() {
        const q = document.getElementById('search-query').value;
        if(!q) return alert("Введите запрос");
        
        document.getElementById('search-status').innerText = "Поиск...";
        document.getElementById('results-container').innerHTML = "";
        document.getElementById('edit-section').style.display = 'none';

        const res = await request({action: 'search', query: q});
        document.getElementById('search-status').innerText = "";
        
        if(res.success) {
            currentSearchResults = res.data;
            if(res.data.length > 0) {
                renderTable(res.data);
                document.getElementById('edit-section').style.display = 'block';
            } else {
                document.getElementById('results-container').innerHTML = "<p class='hint'>Ничего не найдено.</p>";
            }
        } else alert("Ошибка: " + res.error);
    }

    function renderTable(data) {
        let html = `<table>
            <tr>
                <th>Panel_pn</th>
                <th>DATA</th>
                <th>PN</th>
                <th>Location</th>
                <th>info</th>
            </tr>`;
        data.forEach(row => {
            html += `<tr>
                <td>${row.panel_pn}</td>
                <td>${row.data}</td>
                <td>${row.pn}</td>
                <td>${row.location}</td>
                <td>${row.info}</td>
            </tr>`;
        });
        html += "</table>";
        document.getElementById('results-container').innerHTML = html;
    }

    async function updateBulk() {
        if(currentSearchResults.length === 0) return;
        
        const rowNumbers = currentSearchResults.map(r => r.rowNumber);
        const newData = document.getElementById('edit-data').value;
        const newLocation = document.getElementById('edit-location').value;
        const newInfo = document.getElementById('edit-info').value;

        if(!newData && !newLocation && !newInfo) return alert("Заполните хотя бы одно поле!");
        if(!confirm(`Обновить ${rowNumbers.length} строк?`)) return;

        document.getElementById('search-status').innerText = "Обновление...";
        
        const res = await request({
            action: 'updateBulk',
            rowNumbers: rowNumbers,
            data: newData,
            location: newLocation,
            info: newInfo
        });
        
        document.getElementById('search-status').innerText = "";
        
        if(res.success) {
            alert(res.message);
            document.getElementById('edit-data').value = "";
            document.getElementById('edit-location').value = "";
            document.getElementById('edit-info').value = "";
            searchData(); 
        } else alert("Ошибка: " + res.error);
    }
</script>
</body>
</html>
